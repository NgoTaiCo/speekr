[package]
name = "speekr"
version = "1.0.0"
edition = "2024"
description = "Neural text-to-speech and translation from your system tray"
homepage = "https://github.com/NgoTaiCo/speekr"
repository = "https://github.com/NgoTaiCo/speekr"
license = "Apache-2.0"

[dependencies]
arboard = "3"
global-hotkey = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rodio = "0.21"
serde_json = "1"
tao = "0.34"
thiserror = "2"
tray-icon = "0.21"
wry = "0.55"

[features]
default = []
edge-audio = []
