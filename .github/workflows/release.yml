name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # Windows — .exe + .msi installer
  # ─────────────────────────────────────────────
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        run: iscc installer\speekr.iss

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: speekr-windows-exe
          path: target/release/speekr.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: speekr-windows-installer
          path: installer/Output/speekr-setup-*.exe

  # ─────────────────────────────────────────────
  # macOS — universal binary (.tar.gz)
  # ─────────────────────────────────────────────
  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/speekr dist/speekr
          chmod +x dist/speekr
          tar -czf dist/speekr-macos.tar.gz -C dist speekr

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: speekr-macos
          path: dist/speekr-macos.tar.gz

  # ─────────────────────────────────────────────
  # Linux (Ubuntu) — binary (.tar.gz)
  # ─────────────────────────────────────────────
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/speekr dist/speekr
          chmod +x dist/speekr
          tar -czf dist/speekr-linux.tar.gz -C dist speekr

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: speekr-linux
          path: dist/speekr-linux.tar.gz

  # ─────────────────────────────────────────────
  # Create GitHub Release
  # ─────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/speekr-windows-exe/speekr.exe
            artifacts/speekr-windows-installer/speekr-setup-*.exe
            artifacts/speekr-macos/speekr-macos.tar.gz
            artifacts/speekr-linux/speekr-linux.tar.gz
